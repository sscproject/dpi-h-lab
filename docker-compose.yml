# Local trial only: the app and PostgreSQL on this machine. Not a production setup.
# For a server, put a TLS proxy (e.g. Caddy) in front, keep the app and database ports private,
# and use strong secrets: see docs/deploying.md.
#
#   cp .env.example .env     # then set JWT_SECRET (and POSTGRES_PASSWORD if you like)
#   docker compose up --build
#   open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dpih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpih}
      POSTGRES_DB: dpih
    # No published port: only the app container reaches the database.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpih"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://dpih:${POSTGRES_PASSWORD:-dpih}@db:5432/dpih
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Reached directly, with no proxy in front.
      TRUST_PROXY: "0"
      PORT: 3000
    # Only this machine can reach it.
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
